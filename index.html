<p>7.3 Auf Schadensersatz haftet AL – gleich aus welchem Rechtsgrund – bei Vorsatz und grober Fahrlässigkeit. Bei einfacher Fahrlässigkeit haftet AL nur: • für Schäden aus der Verletzung des Lebens, des Körpers oder der Gesundheit, • für Schäden aus der Verletzung einer wesentlichen Vertragspflicht (Verpflichtung, deren Erfüllung die ordnungsgemäße Durchführung des Vertrags überhaupt erst ermöglicht und auf deren Einhaltung der Vertragspartner regelmäßig vertraut und vertrauen darf); in diesem Fall ist die Haftung von AL jedoch auf den Ersatz des vorhersehbaren, typischerweise eintretenden Schadens, maximal bis zu € 25.000,00 pro Schadensfall begrenzt.</p>
<p>7.4 Alle vertraglichen Ansprüche gegen AL einschließlich der Ansprüche aus positiver Vertragsverletzung (Mangelfolgeschäden) und aus Verschulden bei Vertragsschluss verjähren nach sechs Monaten ab Auskunftserteilung.</p>
<h3>8. Verbot der Weitergabe</h3>
<p>8.1 Eine Abtretung des Anspruchs auf Erteilung von Auskünften bzw. eine Weitergabe der Daten der Auskünfte oder eine Bereithaltung zum Abruf oder zur Einsicht der Daten an bzw. durch Konzernunternehmen, Tochtergesellschaften oder sonstige Dritte in unveränderter oder weiterbearbeiteter Form, in Auszügen, Kurzfassungen oder Teilbeständen sind nicht gestattet. Eine Ausnahme hierzu stellt der Kontoauszug (Ziffer 4.6) dar, welcher zur Vorlage bei Dritten gedacht ist.</p>
<p>8.2 Im Falle eines vorsätzlichen oder grob fahrlässigen Verstoßes gegen dieses Weitergabeverbot verwirkt der Nutzer eine Vertragsstrafe in Höhe der doppelten Auskunftsgebühr. Die Geltendmachung eines weitergehenden Schadens bleibt vorbehalten.</p>

<h3>9. Datenschutz</h3>
<p>9.1 Nach dem Bundesdatenschutzgesetz (BDSG) setzt die Übermittlung personenbezogener Daten (§ 3 Abs. 1 BDSG) u. a. das Vorliegen eines berechtigten Interesses auf Seiten des Dritten (hier des Nutzers), an den die Daten übermittelt werden, voraus (§ 29 Abs. 2 Ziffer 1 BDSG).</p>
<p>9.2 Die von AL angebotenen Auskünfte erfolgen in einem automatisierten Abrufverfahren. Jeder Nutzer ist daher gem. § 29 Abs. 2 Satz 4 BDSG verpflichtet, die Gründe sowie die Art und Weise der Darlegung seines berechtigten Interesses für jede einzelne erfolgte Auskunft aufzuzeichnen und bei Aufforderung AL mitzuteilen. Diese Angaben können von AL auf Nachfrage dritter Auskunfteien bzw. Dienstleister an diese übermittelt werden.</p>
<p>9.3 AL ist berechtigt, im Einzelfall ohne Angabe von Gründen das Vorliegen eines berechtigten Interesses im Rahmen von Stichprobenkontrollen zu prüfen. AL wird dem Nutzer zu diesem Zweck ein Formblatt übersenden, mit Hilfe dessen er den Vorgang zu beschreiben hat. Der Nutzer ist zu vollständigen und wahrheitsgemäßen Angaben verpflichtet. AL kann bei unzureichenden oder zweifelhaften Angaben zusätzlich die Vorlage von Dokumenten und Nachweisen verlangen, aus denen sich das berechtigte Interesse des Nutzers ergibt.</p>
<p>9.4 Der Nutzer darf die übermittelten Daten nur zu dem Zweck nutzen oder verarbeiten, zu dessen Erfüllung sie ihm übermittelt wurden. Die Verarbeitung oder Nutzung für andere Zwecke ist nur unter den datenschutzrechtlichen Voraussetzungen des BDSG zulässig.</p>
<p>9.5 Der Nutzer hat seine Mitarbeiter oder sonstige Dritte, die notwendiger Weise Zugang zu den Daten der Auskunft haben, zur Verschwiegenheit zu verpflichten. Er hat in geeigneter Weise Vorkehrungen zum Schutze und zur Sicherung der ihm anvertrauten Daten gegen den unbefugten Zugriff der eigenen Mitarbeiter oder Dritter zu treffen, und zwar in dem Maße, wie es auch zum Schutz der eigenen Daten üblich ist.</p>
<p>9.6 Der Nutzer wird hiermit davon unterrichtet, dass Identifikations- und Nutzungsdaten, wie z. B. Adresse und Bestelldatum, gespeichert und zu Dokumentations- und Abrechnungszwecken sowie zur Datensicherheitskontrolle maschinell verarbeitet und genutzt werden.</p>
<p>9.7 Der Nutzer wird hiermit davon unterrichtet, dass AL den liefernden Auskunfteien und Dienstleistern die belieferten Nutzer samt Anschrift mitteilen wird, wenn die Auskunfteien und Dienstleister die gesetzliche Auskunftspflicht des § 34 BDSG zu erfüllen haben.</p>

<p>10.2 Der Nutzer sichert zu, dass die von ihm eingebrachten Inhalte zutreffend und vollständig sind und dass er zu ihrer Verwendung berechtigt ist. Er stellt sicher, dass durch das Hochladen keine Rechte Dritter verletzt werden, insbesondere keine Urheber-, Persönlichkeits- oder Datenschutzrechte.</p>
<p>10.3 Eine inhaltliche Überprüfung eingebrachter Inhalte durch AL findet nicht statt. Insbesondere wird nicht geprüft, ob hochgeladene Dokumente echt sind, von der ausstellenden Stelle stammen oder den aktuellen Stand wiedergeben. AL haftet nicht für die Richtigkeit, Vollständigkeit und Aktualität eingebrachter Inhalte sowie für Schlussfolgerungen, die auf ihrer Grundlage gezogen werden.</p>
<p>10.4 Eingebrachte Inhalte werden im Prüfbericht als solche gekennzeichnet. Ein Prüfbericht, der eingebrachte Inhalte enthält, stellt insoweit keine Feststellung von AL dar.</p>

<p>11.1 Der Vertrag mit dem Nutzer auf Erteilung von Auskünften hat eine Mindestlaufzeit von 12 Monaten. Er verlängert sich um weitere 12 Monate, sofern der Vertrag nicht mit einer Frist von 3 Monaten vor Ablauf durch eingeschriebenen Brief gekündigt wird.</p>
